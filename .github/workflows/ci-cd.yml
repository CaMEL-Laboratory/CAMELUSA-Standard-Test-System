name: Build and Deploy to Jetson TX2

# 触发条件：当 PR 被合并到 main 分支（本质上就是 main 收到 push 事件）时自动触发
on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # 保留手动一键触发按钮，方便随时调试

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/camelusa/yolov5-gate:latest
  CONTAINER_NAME: yolov5-gate-app

jobs:
  # ==========================================
  # 阶段 1：在云端构建/推送镜像 (或者如果你只推代码直接部署，可跳过镜像构建)
  # ==========================================
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}

  # ==========================================
  # 阶段 2：在远程 Jetson TX2 上自动拉取并重启容器
  # ==========================================
  deploy-to-tx2:
    # 关键配置：必须等阶段 1 彻底成功后再执行
    needs: build-and-push
    # 指定在带有 jetson-tx2 标签的自建 Runner 上运行
    runs-on: [self-hosted, jetson-tx2]

    steps:
      - name: Pull latest image and restart container
        run: |
          echo "1. 正在从 GHCR 拉取最新镜像..."
          docker pull ${{ env.IMAGE_NAME }}

          echo "2. 停止并删除旧的运行中容器..."
          docker stop ${{ env.CONTAINER_NAME }} || true
          docker rm ${{ env.CONTAINER_NAME }} || true

          echo "3. 使用最新镜像启动新容器（挂载 GPU 与摄像头等硬件设备）..."
          docker run -d \
            --name ${{ env.CONTAINER_NAME }} \
            --restart always \
            --runtime nvidia \
            --network host \
            -v /home/nvidia/records:/app/records \
            ${{ env.IMAGE_NAME }}

          echo "4. 清理旧的悬空镜像以释放 TX2 宝贵的存储空间..."
          docker image prune -f