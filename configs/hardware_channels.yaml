# ==============================================================================
# 🛠️ 工业边缘计算集成系统全量硬件与算法配置文件 (Integrated Industrial Edge System)
# ==============================================================================
system_id: "Integrated_Industrial_Edge_System_01"  # 节点唯一标识，多设备分布式部署时区分站点

# ------------------------------------------------------------------------------
# 1. 📁 路径与物理硬件绑定配置 (注：此类参数修改后需重启容器生效)
# ------------------------------------------------------------------------------
paths_and_hardware:
  # --- 基础模型与库文件路径 ---
  yolov5_path: "/app"                                                   # YOLOv5 项目根目录路径
  model_path: "/app/best.pt"                                            # YOLOv5 人脸检测模型权重文件
  face_db_dir: "/app/ID"                                                # 已授权人员人脸特征图库目录
  shape_predictor_path: "/app/shape_predictor_68_face_landmarks.dat"    # Dlib 68点人脸特征标定模型
  mvsdk_python_path: "/opt/GeneralMVTech/MVviewer/share/Python"          # 华睿 MVSDK Python 接口库路径
  mvsdk_lib_path: "/opt/GeneralMVTech/MVviewer/lib"                      # 华睿 MVSDK C/C++ 底层动态库路径

  # --- 物理设备节点绑定 ---
  camera_id: "/dev/video0"                                              # 视频设备节点路径（USB/CSI摄像头）
  relay_serial_port: "/dev/ttyUSB0"                                     # 门禁继电器控制串口硬件节点
  
  # --- 串口通讯波特率 ---
  # 效果描述：必须与物理继电器控制板的硬开关/固件波特率严格一致。
  # 趋势影响：配错会导致串口通信乱码或无法触发开门脉冲。
  baudrate: 9600                                                        # 串口波特率 (bps)

  # --- 网络与 Alexa 语音组件绑定 ---
  local_ip: "10.0.0.58"                                                 # 精准绑定的 Jetson TX2 无线网卡 IP (wlan0)
  wemo_port: 8080                                                      # WeMo HTTP 模拟服务端监听端口
  device_name: "Gate Lock"                                              # Alexa 语音唤醒显示的设备名称
  device_uuid: "Socket-1_0-220000000001"                                # 虚拟 WeMo 设备 UUID 标识符

# ------------------------------------------------------------------------------
# 2. ⏱️ 门禁控制逻辑与时间控制参数 (🌟 支持运行时修改，热更新即时生效)
# ------------------------------------------------------------------------------
gate_logic:
  # --- 开门成功提示维持时间 (秒) ---
  # 效果描述：人脸识别成功后，屏幕画框与开门提示信息保持显示的时间。
  # 趋势影响：
  #   - 调大 (如 10.0)：开门成功提示信息在屏幕上停留更久，便于人员观察，但可能延缓下一位人员的直观反馈。
  #   - 调小 (如 2.0) ：提示刷新更快，界面反应利落。
  open_duration: 5.0

  # --- 开门成功后的防抖冷却期 (秒) ---
  # 效果描述：人脸识别成功开门后，系统拒绝再次触发继电器的硬件保护时间。
  # 趋势影响：
  #   - 调大 (如 60.0)：极大保护继电器硬件，彻底防止同一个人站在门口反复触发继电器开关，适用于通行人流稀疏的安全重地。
  #   - 调小 (如 5.0) ：适合高频连续通行的场景（如上下班高峰期），防止后续通行人员被误判为“处于冷却期”而拦截。
  cooldown_time: 30.0

  # --- 识别成功/检测到人脸时的抓拍与日志记录间隔 (秒) ---
  # 效果描述：同一候选人连续出现在镜头前时，写入日志与抓拍保存图片的最小时间间隔。
  # 趋势影响：
  #   - 调大 (如 10.0)：极大节省磁盘存储空间与日志体积，防止刷屏。
  #   - 调小 (如 1.0) ：抓拍更密集，记录更详尽，但会增加存储消耗和磁盘 I/O 写入开销。
  detect_cooldown: 3.0

  # --- 未知人员/未授权通行抓拍间隔 (秒) ---
  # 效果描述：检测到陌生人或比对失败时，抓拍 UNKNOWN 图片与记录警告日志的间隔。
  # 趋势影响：
  #   - 调大 (如 10.0)：防止陌生人长时间停留在镜头前导致抓拍文件夹暴涨。
  #   - 调小 (如 1.0) ：对非法入侵抓拍留底更严密，便于事后防范追溯。
  unknown_cooldown: 3.0

  # --- 继电器开门脉冲高电平持续时间 (秒) ---
  # 效果描述：串口向继电器发送开门指令后，保持闭合导通的时间。
  # 趋势影响：
  #   - 调大 (如 5)：给电控锁/磁力锁留出更长的退锁行程时间，适合机械结构响应较慢的大门。
  #   - 调小 (如 1)：脉冲更迅速，但若锁具响应慢可能导致未能完全解锁。
  jog_time: 2

  # --- 历史抓拍图片与日志文件保存天数 (天) ---
  # 效果描述：自动清理工具在每日零点过期清理的日志与记录文件保留期限。
  # 趋势影响：
  #   - 调大 (如 730)：保存更久的历史追溯数据，但占用磁盘空间大（TX2 存储空间紧张时需注意）。
  #   - 调小 (如 30) ：自动保持存储空间精简，防磁盘写满崩溃。
  keep_record_days: 365

# ------------------------------------------------------------------------------
# 3. 📷 相机硬件与自适应光照控制参数 (华睿 MVSDK 工业相机配置)
# ------------------------------------------------------------------------------
camera_control:
  # --- 相机目标采帧帧率 (FPS) ---
  # 效果描述：工业相机每秒抓取并传输至内存的图像帧数。
  # 趋势影响：
  #   - 调大 (如 8.0)：确保 0.5 秒识别窗口内有充足采样帧，捕捉更敏捷，但会占用更多 CPU/GPU 算力。
  #   - 调小 (如 2.0)：降低系统功耗和算力开销，但在人员快速走过时可能漏帧。
  target_fps: 4.0

  # --- 自动曝光上限值 (微秒 / µs) ---
  # 效果描述：暗光环境下相机的最大允许曝光时间。
  # 趋势影响：
  #   - 调大 (如 30000)：大幅提升暗光环境下的画面亮度，但人员走动时易产生“拖影/虚影”，降低识别率。
  #   - 调小 (如 10000)：彻底消除暗光下人员走动拖影，但需依赖增益补偿画面亮度。
  max_exposure_time_us: 21000.0

  # --- 自动曝光下限值 (微秒 / µs) ---
  # 效果描述：强光/逆光环境下相机的最小允许曝光时间。
  min_exposure_time_us: 20.0

  # --- 自动增益上限值 (dB) ---
  # 效果描述：暗光下硬件信号放大增益的最大限制。
  # 趋势影响：
  #   - 调大 (如 24.0)：进一步增强夜间或弱光下的图像亮度，但会引入较多噪点（雪花点）。
  #   - 调小 (如 12.0)：画面更加纯净细腻，但在极暗环境下可能导致人脸过暗无法识别。
  max_gain_raw: 20.0

# ------------------------------------------------------------------------------
# 4. 🧠 算法推理与识别阈值配置 (🌟 支持运行时修改，热更新即时生效)
# ------------------------------------------------------------------------------
algorithm_thresholds:
  # --- YOLO 模型推理输入尺寸 (像素) ---
  # 效果描述：送入神经网络进行前向推理的图像长宽。
  # 趋势影响：
  #   - 调大 (如 640)：对远距离小目标的检测能力显著增强，但推理耗时翻倍，帧率下降。
  #   - 调小 (如 224)：推理速度极快、显存占用低，但对远景人脸或模糊人脸的检出率下降。
  inference_size: 320

  # --- 帧检测跳帧间隔 ratio ---
  # 效果描述：每隔多少帧执行一次完整的 YOLO 深度学习前向检测。
  # 趋势影响：
  #   - 调大 (如 8)：极大节省 GPU 算力、降低功耗，但目标框跟随的平滑度会变差。
  #   - 调小 (如 2)：检测响应极度丝滑实时，但 Jetson TX2 负载会显著上升。
  skip_ratio: 4

  # --- YOLO 人脸检测置信度阈值 (0.0 - 1.0) ---
  # 效果描述：过滤背景杂噪、阴影或低质量候选框的硬性门限。
  # 趋势影响：
  #   - 调大 (如 0.60)：过滤背景砖缝、反光或阴影等低置信度误报的能力极强，但可能漏掉侧脸或戴口罩人员。
  #   - 调小 (如 0.20)：对模糊、侧脸或远距离人脸包容度高，但容易把背景杂物误识别为人脸。
  face_confidence_threshold: 0.35  

  # --- 人脸欧氏距离匹配严格阈值 (Distance, 越小越严格) ---
  # 效果描述：Dlib 特征向量比对时的最大允许距离。
  # 趋势影响：
  #   - 调大 (如 0.52)：对非注册人员或长相相似者的包容度放宽，识别更容易通过，但误识率（Security Risk）上升。
  #   - 调小 (如 0.40)：比对极其严格，只有特征极度吻合才能开门，安全等级极高，但本人稍微变换角度或光线可能被拒。
  strict_threshold: 0.46

  # --- 眨眼活体验证 EAR (Eye Aspect Ratio) 眼睛纵横比阈值 ---
  # 效果描述：判定眼睛处于闭合状态的几何长宽比临界值。
  # 趋势影响：
  #   - 调大 (如 0.28)：对眨眼动作的判定变得非常宽松（稍微闭眼就算），防伪能力变弱。
  #   - 调小 (如 0.20)：必须闭眼幅度非常明显才算，能有效防止误判，但对眯眼或小眼睛人群不够友好。
  eye_ar_thresh: 0.24

  # --- 眨眼活体验证连续闭眼判定帧数 ---
  # 效果描述：要求连续多少帧检测到 EAR 小于阈值才确认完成有效眨眼。
  # 趋势影响：
  #   - 调大 (如 3)：需要更长时间的闭眼过程，彻底杜绝眨眼抓拍巧合，但交互延迟变长。
  #   - 调小 (如 1)：响应灵敏，单帧闭眼即可通过活检。
  eye_ar_consec_frames: 1

  # --- 画面运动变化率敏感度阈值 (0.0 - 1.0) ---
  # 效果描述：基于帧差法，画面像素突变比例达到多少时触发“运动防刷脸抓拍”。
  # 趋势影响：
  #   - 调大 (如 0.25)：只有当画面发生大面积剧烈运动（如多人奔跑闯入）时才触发抓拍，能完美过滤夜间底噪和光影抖动。
  #   - 调小 (如 0.03)：敏锐捕捉微小走动或蚊虫飞过，抓拍更灵敏，但容易在光影变化时产生冗余抓拍。
  motion_threshold_ratio: 0.12

  # --- 运动抓拍最小触发间隔 (秒) ---
  motion_cooldown_time: 1.0

# ------------------------------------------------------------------------------
# 5. 🎨 显示界面与类别标签映射配置
# ------------------------------------------------------------------------------
ui_mapping:
  blue_color: [255, 0, 0]        # 正常识别/匹配成功框颜色 (蓝色)
  green_color: [0, 255, 0]      # 备用绿色
  red_color: [0, 0, 255]        # 未授权/未知人员 UNKNOWN 警示框颜色 (红色)
  yellow_color: [0, 255, 255]   # 系统处于开门冷却期 COOLDOWN 提示框颜色 (黄色)
  
  # YOLO 类别 ID 到已知人员库姓名映射
  name_map:
    0: "Amanda"
    1: "Ines"
    2: "Eric"
    3: "Ethan"

# ------------------------------------------------------------------------------
# 6. 🌐 MQTT 控制面消息总线配置
# ------------------------------------------------------------------------------
mqtt_config:
  broker: "localhost"           # MQTT Broker 地址（Docker 中填 mqtt-broker 服务名或 127.0.0.1）
  port: 1883                    # MQTT 标准通信端口
  command_topic: "home/gate/command" # 接收上位机 (Ignition / HA) 控制指令的主题
  status_topic: "home/gate/status"   # 向上位机实时广播门逻辑状态 (Locked/Unlocked) 的主题

# ------------------------------------------------------------------------------
# 7. 📡 工业传感器扩展微服务通道配置 (对应 DAQ 与遥测微服务)
# ------------------------------------------------------------------------------
vibration_daq:
  sample_rate_hz: 51200         # 振动 DAQ 采样率 (51.2 kHz)
  fft_window_size: 4096         # FFT 频谱分析窗口大小
  channels:
    - physical_id: "ai0"
      name: "Wing_Left_Vibe_X"
      group: "CollectionL"
      sensitivity_mv_per_g: 100.0
    - physical_id: "ai1"
      name: "Wing_Right_Vibe_X"
      group: "CollectionR"
      sensitivity_mv_per_g: 100.0

temperature_telemetry:
  sample_interval_sec: 1.0      # 低频温度采样间隔 (秒)
  warning_threshold_celsius: 65.0 # 温度预警门限 (℃)
  critical_threshold_celsius: 80.0 # 温度严重报警门限 (℃)
  channels:
    - physical_id: "temp_ch0"
      name: "TX2_Core_Temp"
    - physical_id: "temp_ch1"
      name: "Gate_Cabinet_Temp"